name: Autorizar conexión MCP de ELAH
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Identificador de la solicitud OAuth mostrado por ELAH. Aprobar solo una solicitud propia.'
        required: true
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  autorizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aprobar con la identidad firmada de GitHub
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          ELAH_PUBLIC_ORIGIN: https://elah-boutique.elahboutique-sc.workers.dev
        run: |
          python3 - <<'PY'
          import json, os, re, time, base64, urllib.request, urllib.parse, urllib.error
          request_id = os.environ['REQUEST_ID'].strip()
          if not re.fullmatch(r'[-_A-Za-z0-9]{43}', request_id):
              raise SystemExit('Identificador inválido')
          origin = os.environ.get('ELAH_PUBLIC_ORIGIN') or 'https://elah-boutique.vercel.app'
          parsed = urllib.parse.urlsplit(origin)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.path or parsed.query or parsed.fragment:
              raise SystemExit('Origen ELAH inválido')
          audience = origin + '/oauth/approve'
          oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(audience, safe='')
          req = urllib.request.Request(oidc_url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=20) as response:
              token = json.load(response)['value']
          claims = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '==='))
          print(json.dumps({'audience_matches': claims.get('aud') == audience, 'repository_matches': claims.get('repository') == 'elahboutiquesc/-elah-boutique', 'repository_id_matches': claims.get('repository_id') == '1373614442', 'main_branch': claims.get('ref') == 'refs/heads/main', 'dispatch_event': claims.get('event_name') == 'workflow_dispatch', 'workflow_matches': claims.get('workflow_ref') == 'elahboutiquesc/-elah-boutique/.github/workflows/autorizar-mcp.yml@refs/heads/main', 'token_lifetime_seconds': claims.get('exp', 0) - claims.get('iat', 0)}))
          req = urllib.request.Request(audience, data=json.dumps({'request_id': request_id}).encode(), headers={'Content-Type':'application/json','Authorization':'Bearer ' + token})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit('No fue posible aprobar la solicitud')
          except urllib.error.HTTPError as error:
              try:
                  diagnostic = json.load(error).get('error_description', '')
                  if re.fullmatch(r'approval_[a-z_]{1,40}', diagnostic):
                      print('Comprobación rechazada: ' + diagnostic)
              except Exception:
                  pass
              messages = {
                  400: 'Solicitud caducada, inexistente o ya completada. Inicia una conexión nueva en ChatGPT y usa su nuevo request_id.',
                  403: 'GitHub no pudo acreditar la identidad autorizada para este workflow en main.',
                  503: 'El servicio OAuth o su almacenamiento no está disponible. Reintenta mientras la solicitud siga vigente.'
              }
              raise SystemExit(messages.get(error.code, 'El servicio rechazó la aprobación (HTTP ' + str(error.code) + ').'))
          except Exception:
              raise SystemExit('No fue posible aprobar la solicitud. Comprueba que siga vigente y que el despliegue OAuth esté disponible.')
          print('Solicitud aprobada. Vuelve a la ventana de autorización de ELAH.')
          PY
