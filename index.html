<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F7EFEA"><title>ELAH Boutique | Moda que te hace sentir tú</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Italianno&family=Playfair+Display:wght@400;500;600&display=swap');:root{--t:#C96A4A;--c:#F7EFEA;--d:#2E2E2E;--b:#5A3E36}*{box-sizing:border-box}body{margin:0;background:#fffdfb;color:var(--d);font-family:'DM Sans',sans-serif}.top{background:var(--b);color:white;text-align:center;padding:10px}.head{text-align:center;padding:18px;background:white}.brand{font:500 38px 'Playfair Display';letter-spacing:9px;color:var(--t)}.brand small{display:block;font:8px 'DM Sans';letter-spacing:5px;color:var(--b)}.hero{padding:70px 8%;background:var(--c)}.hero h1{font:500 clamp(45px,7vw,75px) 'Playfair Display';color:var(--b);margin:0}.hero em{font-family:'Italianno';color:var(--t)}.btn,.add{background:var(--t);color:#fff;border:0;padding:13px 22px;text-decoration:none}.section{max-width:1200px;margin:auto;padding:55px 15px}.heading{text-align:center}.heading h2{font:500 38px 'Playfair Display';color:var(--b)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.pic{aspect-ratio:4/5;background:url('images/elah-blusas.jpg?v=9') no-repeat;background-size:300% 300%}.p0{background-position:0 0}.p1{background-position:50% 0}.p2{background-position:100% 0}.p3{background-position:0 50%}.p4{background-position:50% 50%}.p5{background-position:100% 50%}.p6{background-position:0 100%}.p7{background-position:50% 100%}.p8{background-position:100% 100%}.info{padding:12px;background:#fff}.ref{font-size:10px}.price{color:var(--t);font-weight:600}.add{width:100%;margin-top:8px}.bag{position:fixed;right:15px;bottom:15px;background:var(--b);color:white;border:0;border-radius:30px;padding:14px}.drawer{display:none;position:fixed;right:0;top:0;width:min(400px,95vw);height:100%;background:white;z-index:10;padding:25px}.drawer.show{display:block}.wa{display:block;background:#25D366;color:white;padding:14px;text-decoration:none;margin-top:20px}@media(max-width:700px){.products{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="top">MODA QUE TE HACE SENTIR TÚ ♡</div><header class="head"><div class="brand">ELAH<small>BOUTIQUE</small></div></header><section class="hero"><h1>Moda que te hace <em>sentir tú ♡</em></h1><p>Looks reales para mujeres reales.</p><a class="btn" href="#tienda">VER COLECCIÓN</a></section><main class="section" id="tienda"><div class="heading"><small>NUESTRAS FAVORITAS</small><h2>Piezas que amarás</h2></div><div class="products" id="products"></div></main><button class="bag" onclick="toggle()">BOLSA <span id="count">0</span></button><aside class="drawer" id="drawer"><button onclick="toggle()">×</button><h2>Tu selección</h2><div id="cart"></div><div id="total"></div><a id="wa" class="wa">FINALIZAR POR WHATSAPP</a></aside><script>const PHONE='584247661554',data=[{id:15,r:'ELAH-BL015',n:'Blusa roja de lunares',s:'S',p:15,pos:0},{id:16,r:'ELAH-BL016',n:'Blusa roja drapeada',s:'S',p:10,pos:1},{id:17,r:'ELAH-BL017',n:'Chaleco negro con ribetes',s:'M',p:10,pos:2},{id:18,r:'ELAH-BL018',n:'Corset rojo',s:'M',p:20,pos:3},{id:19,r:'ELAH-BL019',n:'Corset blanco',s:'S',p:28,pos:4},{id:20,r:'ELAH-BL020',n:'Corset beige con perlas',s:'S',p:28,pos:5},{id:22,r:'ELAH-BL022',n:'Top beige con lazo',s:'XS',p:10,pos:6},{id:23,r:'ELAH-BL023',n:'Crop top vino',s:'S',p:7,pos:7},{id:24,r:'ELAH-BL024',n:'Chaleco blanco texturizado',s:'M',p:15,pos:8}];let c=[];products.innerHTML=data.map(x=>`<article><div class="pic p${x.pos}"></div><div class="info"><div class="ref">${x.r}</div><h3>${x.n}</h3><div class="price">$${x.p}.00</div><div>Talla ${x.s}</div><button class="add" onclick="add(${x.id})">AGREGAR A LA BOLSA</button></div></article>`).join('');function add(id){c.push(data.find(x=>x.id===id));draw();drawer.classList.add('show')}function draw(){count.textContent=c.length;cart.innerHTML=c.map((x,i)=>`<p>${x.r} · Talla ${x.s} · $${x.p} <button onclick="del(${i})">Quitar</button></p>`).join('');let t=c.reduce((a,x)=>a+x.p,0);total.textContent=c.length?'Total: $'+t.toFixed(2):'';wa.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent('Hola ELAH Boutique ✨\n'+c.map(x=>x.r+' | Talla '+x.s+' | $'+x.p).join('\n')+'\nTotal: $'+t.toFixed(2))}function del(i){c.splice(i,1);draw()}function toggle(){drawer.classList.toggle('show')}draw()</script></body></html>
